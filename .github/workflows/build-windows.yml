name: Build Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE
        run: >
          pyinstaller
          --onefile
          --windowed
          --name "茄子桌宠"
          --icon=eggplant.ico
          --add-data "eggplant.png;."
          --add-data "eggplant.ico;."
          --hidden-import bubble
          --hidden-import chat
          --hidden-import tray
          --hidden-import storage
          --hidden-import bookmarks
          --hidden-import todos
          --hidden-import ui_theme
          main.py

      - name: Prepare release assets
        shell: pwsh
        run: |
          Copy-Item -Force "dist\茄子桌宠.exe" "dist\EggplantPet-Windows.exe"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eggplant-pet-windows
          path: |
            dist/茄子桌宠.exe
            dist/EggplantPet-Windows.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 茄子桌宠 Windows
          body: |
            ## 下载说明
            下载下方附件即可运行（无需安装 Python）：
            - `茄子桌宠.exe`（中文文件名）
            - `EggplantPet-Windows.exe`（英文文件名，部分环境下载更稳）

            - Commit: `${{ github.sha }}`
            - Workflow run: #${{ github.run_number }}
          files: |
            dist/茄子桌宠.exe
            dist/EggplantPet-Windows.exe
          fail_on_unmatched_files: true
          make_latest: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
