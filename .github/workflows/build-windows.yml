name: Build Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read VERSION
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content -Raw VERSION).Trim()
          if (-not $v) { throw "VERSION is empty" }
          $expectedTag = "v$v"
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $tag = $env:GITHUB_REF_NAME
            if ($tag -ne $expectedTag) {
              throw "Tag '$tag' does not match VERSION file ('$expectedTag'). Bump VERSION before tagging."
            }
          }
          echo "value=$v" >> $env:GITHUB_OUTPUT
          echo "tag=$expectedTag" >> $env:GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build EXE
        run: >
          pyinstaller
          --onefile
          --windowed
          --name "茄子桌宠"
          --icon=eggplant.ico
          --add-data "eggplant.png;."
          --add-data "eggplant.ico;."
          --add-data "VERSION;."
          --hidden-import bubble
          --hidden-import chat
          --hidden-import tray
          --hidden-import storage
          --hidden-import bookmarks
          --hidden-import todos
          --hidden-import ui_theme
          --hidden-import updater
          main.py

      - name: Prepare release assets
        shell: pwsh
        run: |
          Copy-Item -Force "dist\茄子桌宠.exe" "dist\EggplantPet-Windows.exe"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eggplant-pet-windows
          path: |
            dist/茄子桌宠.exe
            dist/EggplantPet-Windows.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: 茄子桌宠 ${{ steps.version.outputs.tag }}
          body: |
            ## 下载说明
            下载下方附件即可运行（无需安装 Python）：
            - `茄子桌宠.exe`（中文文件名）
            - `EggplantPet-Windows.exe`（英文文件名，部分环境下载更稳）

            - Version: `${{ steps.version.outputs.value }}`
            - Commit: `${{ github.sha }}`
            - Workflow run: #${{ github.run_number }}
            - 国内镜像：[Gitee Releases](https://gitee.com/kary2/eggplant-releases/releases)
          files: |
            dist/茄子桌宠.exe
            dist/EggplantPet-Windows.exe
          fail_on_unmatched_files: true
          make_latest: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync Release to Gitee
        continue-on-error: true
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        shell: bash
        run: |
          if [ -z "${GITEE_TOKEN}" ]; then
            echo "GITEE_TOKEN not configured; skip Gitee sync"
            exit 0
          fi
          python scripts/sync_gitee_release.py \
            --tag "${{ steps.version.outputs.tag }}" \
            --name "茄子桌宠 ${{ steps.version.outputs.tag }}" \
            --body "Windows 构建（与 GitHub Release 同步）

          - Version: ${{ steps.version.outputs.value }}
          - Commit: ${{ github.sha }}
          - 主站: https://github.com/1301604100/eggplant/releases" \
            --file "dist/茄子桌宠.exe" \
            --file "dist/EggplantPet-Windows.exe"
